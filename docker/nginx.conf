map $http_x_correlation_id $catalog_correlation_id { default $http_x_correlation_id; "" $request_id; }
server {
  listen 8080;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $catalog_upstream http://catalog-api:8080;
  set $order_upstream http://order-api:8080;
  location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location /api/v1/products { proxy_pass $catalog_upstream; proxy_set_header X-Correlation-ID $request_id; }
  location = /api/v2/products { proxy_pass $catalog_upstream; proxy_set_header X-Correlation-ID $catalog_correlation_id; }
  location ^~ /api/v2/products/ { proxy_pass $catalog_upstream; proxy_set_header X-Correlation-ID $catalog_correlation_id; }
  location ^~ /api/v1/customers/ { proxy_pass $order_upstream; proxy_set_header X-Correlation-ID $request_id; }
  location = /api/v2/me/orders { proxy_pass $order_upstream; proxy_set_header X-Correlation-ID $request_id; }
  location ^~ /api/v2/me/orders/ { proxy_pass $order_upstream; proxy_set_header X-Correlation-ID $request_id; }
  location = /api/v2/admin/orders { proxy_pass $order_upstream; proxy_set_header X-Correlation-ID $request_id; }
  location ^~ /api/v2/admin/orders/ { proxy_pass $order_upstream; proxy_set_header X-Correlation-ID $request_id; }
  location /api/ { return 404; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
