server {
  listen 8080;
  server_name _;
  location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location /api/v1/products { proxy_pass http://catalog-api:8080; proxy_set_header X-Correlation-ID $request_id; }
  location /api/ { proxy_pass http://order-api:8080; proxy_set_header X-Correlation-ID $request_id; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
