name: Frontend order web

on:
  pull_request:
    paths:
      - 'frontend/order-web/**'
      - '.github/workflows/frontend-order-web.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/order-web/**'
      - '.github/workflows/frontend-order-web.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/order-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/order-web/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run playwright
      - run: npm audit --omit=dev
