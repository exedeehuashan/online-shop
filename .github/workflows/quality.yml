name: Quality gates
on: [pull_request, push]
permissions: {contents: read}
concurrency: {group: "quality-${{ github.ref }}", cancel-in-progress: true}
jobs:
  static-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/order-web/package-lock.json}
      - run: mvn -B verify -DskipTests=false -Dtest='!CatalogApiTest,!PostgresPersistenceTest,!OrderApiTest' -Dsurefire.failIfNoSpecifiedTests=false
      - run: npm ci
        working-directory: frontend/order-web
      - run: npm run api:check && npm run typecheck && npm run lint && npm test && npm run test:a11y && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: frontend/order-web
  postgres-contracts:
    needs: static-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/order-web/package-lock.json}
      - run: npm ci
        working-directory: frontend/order-web
      - run: make test-integration test-contracts
  images:
    needs: postgres-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet && docker compose build
      - run: |
          test "$(docker image inspect online-shop-uat-order-api --format '{{.Config.User}}')" = '10001:10001'
          test "$(docker image inspect online-shop-uat-catalog-api --format '{{.Config.User}}')" = '10001:10001'
          test -n "$(docker image inspect online-shop-uat-web --format '{{.Config.User}}')"
          test -n "$(docker image inspect online-shop-uat-order-api --format '{{json .Config.Healthcheck}}')"
  e2e-uat:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/order-web/package-lock.json}
      - run: make compose-up compose-ready
      - run: make test-uat
      - run: make test-e2e
      - if: always()
        run: docker compose logs --no-color > compose.log && docker compose down --remove-orphans
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: uat-evidence, path: "compose.log\nfrontend/order-web/playwright-report", retention-days: 7}
