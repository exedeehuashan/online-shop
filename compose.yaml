name: online-shop-uat
services:
  postgres:
    build: {context: ., dockerfile: docker/postgres.Dockerfile}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-local_admin_only}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [app]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U postgres -d postgres"], interval: 5s, timeout: 3s, retries: 20}
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  order-api:
    build: {context: ., dockerfile: docker/order-api.Dockerfile}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders?connectTimeout=3&socketTimeout=3
      SPRING_DATASOURCE_USERNAME: order_app
      SPRING_DATASOURCE_PASSWORD: order_dev_only
    ports: ["127.0.0.1:${ORDER_API_PORT:-8081}:8080"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  catalog-api:
    build: {context: ., dockerfile: docker/catalog-api.Dockerfile}
    environment:
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog?connectTimeout=3&socketTimeout=3
      CATALOG_DB_USER: catalog_app
      CATALOG_DB_PASSWORD: catalog_dev_only
    ports: ["127.0.0.1:${CATALOG_API_PORT:-8082}:8080"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: docker/web.Dockerfile}
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    depends_on: {order-api: {condition: service_healthy}, catalog-api: {condition: service_healthy}}
    networks: [app]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
networks: {app: {}}
volumes: {postgres-data: {}}
