spring:
  application:
    name: catalog-api
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DB_USER:catalog_app}
    password: ${CATALOG_DB_PASSWORD:catalog_dev_only}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    locations: classpath:db/catalog
catalog:
  security:
    # Access tokens require exp; expiry/nbf are enforced with explicit zero clock skew.
    clock-skew: ${CATALOG_OIDC_CLOCK_SKEW:PT0S}
    enabled: ${CATALOG_SECURITY_ENABLED:false}
    issuer: ${CATALOG_OIDC_ISSUER:}
    audience: ${CATALOG_OIDC_AUDIENCE:}
    jwk-set-uri: ${CATALOG_OIDC_JWKS_URI:}
    algorithm: ${CATALOG_OIDC_ALGORITHM:RS256}
    identity-base-url: ${IDENTITY_INTERNAL_URL:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints.web.exposure.include: health
  endpoint:
    health:
      probes.enabled: true
      group.readiness.include: readinessState,db,catalogReconciliation
