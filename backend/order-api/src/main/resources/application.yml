spring:
  application:
    name: order-api
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
springdoc:
  api-docs:
    path: /v3/api-docs
order:
  security:
    enabled: ${ORDER_SECURITY_ENABLED:false}
    jwk-set-uri: ${ORDER_OIDC_JWKS_URI:}
    issuer: ${ORDER_OIDC_ISSUER:}
    audience: ${ORDER_OIDC_AUDIENCE:}
    identity-base-url: ${ORDER_IDENTITY_BASE_URL:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
