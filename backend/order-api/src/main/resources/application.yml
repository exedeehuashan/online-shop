spring:
  application:
    name: order-api
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
springdoc:
  api-docs:
    path: /v3/api-docs
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
