# Local disposable UAT only. Merge after compose.yaml for generated projects/volumes.
x-migration: &migration
  image: flyway/flyway:10.20-alpine
  networks: [app]
  restart: "no"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  postgres:
    labels:
      online-shop.uat.owner: ${UAT_RUN_OWNER:-manual}
      online-shop.uat.ci-nonce: ${UAT_RUN_NONCE:-manual}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-runtime-roles.sh:/docker-entrypoint-initdb.d/20-runtime-roles.sh:ro
    tmpfs: [/run/postgresql]
  migrate-orders:
    <<: *migration
    command: [-connectRetries=30, migrate]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/orders
      FLYWAY_USER: order_migration
      FLYWAY_PASSWORD: ${ORDER_MIGRATION_PASSWORD:-order_migration_local_only}
      FLYWAY_LOCATIONS: filesystem:/migrations
    volumes: [./backend/order-adapters-persistence/src/main/resources/db/migration:/migrations:ro]
    depends_on: {postgres: {condition: service_healthy}}
  migrate-catalog:
    <<: *migration
    command: [-connectRetries=30, migrate]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/catalog
      FLYWAY_USER: catalog_migration
      FLYWAY_PASSWORD: ${CATALOG_MIGRATION_PASSWORD:-catalog_migration_local_only}
      FLYWAY_LOCATIONS: filesystem:/migrations
    volumes: [./backend/catalog-adapters-persistence/src/main/resources/db/catalog:/migrations:ro]
    depends_on: {postgres: {condition: service_healthy}}
  migrate-identity:
    <<: *migration
    command: [-connectRetries=30, migrate]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/identity
      FLYWAY_USER: identity_migration
      FLYWAY_PASSWORD: ${IDENTITY_MIGRATION_PASSWORD:-identity_migration_local_only}
      FLYWAY_LOCATIONS: filesystem:/migrations
    volumes: [./backend/identity-adapters-persistence/src/main/resources/db/identity:/migrations:ro]
    depends_on: {postgres: {condition: service_healthy}}
  order-api:
    environment:
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_USERNAME: order_runtime
      SPRING_DATASOURCE_PASSWORD: ${ORDER_RUNTIME_PASSWORD:-order_runtime_local_only}
    depends_on: {migrate-orders: {condition: service_completed_successfully}}
  catalog-api:
    environment:
      SPRING_FLYWAY_ENABLED: "false"
      CATALOG_DB_USER: catalog_runtime
      CATALOG_DB_PASSWORD: ${CATALOG_RUNTIME_PASSWORD:-catalog_runtime_local_only}
    depends_on: {migrate-catalog: {condition: service_completed_successfully}}
  identity-api:
    environment:
      SPRING_FLYWAY_ENABLED: "false"
      IDENTITY_DB_USER: identity_runtime
      IDENTITY_DB_PASSWORD: ${IDENTITY_RUNTIME_PASSWORD:-identity_runtime_local_only}
    depends_on: {migrate-identity: {condition: service_completed_successfully}}
  uat-rbac-fixture:
    environment:
      PGPASSWORD: ${IDENTITY_RUNTIME_PASSWORD:-identity_runtime_local_only}
    command:
      - sh
      - -ec
      - |
        until pg_isready -h postgres -U identity_runtime -d identity; do sleep 1; done
        psql -h postgres -U identity_runtime -d identity -v ON_ERROR_STOP=1 <<'SQL'
        INSERT INTO sys_role(id, code, name, description, status, system_role, version, created_at, updated_at)
        VALUES ('30000000-0000-0000-0000-000000000025', 'qa_mutable_role', 'QA mutable role',
                'Isolated full-stack acceptance fixture', 'ACTIVE', false, 0, current_timestamp, current_timestamp)
        ON CONFLICT (id) DO UPDATE SET name=EXCLUDED.name, description=EXCLUDED.description,
          status='ACTIVE', updated_at=current_timestamp
          WHERE sys_role.code='qa_mutable_role' AND sys_role.system_role=false;
        SQL
volumes:
  postgres-data:
    labels:
      online-shop.uat.owner: ${UAT_RUN_OWNER:-manual}
      online-shop.uat.ci-nonce: ${UAT_RUN_NONCE:-manual}
